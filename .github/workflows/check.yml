name: Check content

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: dtolnay/rust-toolchain@stable
      - name: Traditional Chinese is up to date
        run: |
          pip install opencc-python-reimplemented
          python tools/zh_tw.py --check
      - name: Lessons, exercises and every reference solution
        run: python tools/check.py --examples --jobs 4
