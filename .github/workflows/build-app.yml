name: Build app

# Builds the learning app for Windows, macOS and Linux.
# Push a tag like v1.0.0 to publish a GitHub Release with the downloads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-14
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: pip install pyinstaller PySide6 pillow
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Build
        run: pyinstaller app/tutor.spec --noconfirm --distpath dist --workpath build
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "app-${{ matrix.name }}.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist && APP=$(ls -d *.app | head -1)
          ditto -c -k --keepParent "$APP" "../app-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "app-${{ matrix.name }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: app-${{ matrix.name }}.*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
