[[exercise]]
id = "count-substr"
kind = "code"
solution = '''
#include <stdio.h>
#include <string.h>

int main(void) {
    char text[1001], word[101];
    if (fgets(text, sizeof text, stdin) == NULL || fgets(word, sizeof word, stdin) == NULL) {
        return 1;
    }
    text[strcspn(text, "\n")] = '\0';
    word[strcspn(word, "\n")] = '\0';
    int count = 0;
    if (word[0] != '\0') {
        char *p = strstr(text, word);
        while (p != NULL) {
            count++;
            p = strstr(p + 1, word);
        }
    }
    printf("%d\n", count);
    return 0;
}
'''
