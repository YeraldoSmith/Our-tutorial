[[exercise]]
id = "qsort-desc"
kind = "code"
solution = '''
#include <stdio.h>
#include <stdlib.h>

#define MAX_N 1000

int compare_desc(const void *a, const void *b) {
    int x = *(const int *)a;
    int y = *(const int *)b;
    return (x < y) - (x > y);
}

int main(void) {
    int a[MAX_N];
    int n = 0;
    scanf("%d", &n);
    for (int i = 0; i < n; i++) {
        scanf("%d", &a[i]);
    }
    qsort(a, n, sizeof a[0], compare_desc);
    for (int i = 0; i < n; i++) {
        printf(i == 0 ? "%d" : " %d", a[i]);
    }
    printf("\n");
    return 0;
}
'''
