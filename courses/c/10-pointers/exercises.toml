[[exercise]]
id = "reverse-ptr"
kind = "code"
solution = '''
#include <stdio.h>
#include <string.h>

void reverse(char *s) {
    if (*s == '\0') {
        return;
    }
    char *left = s;
    char *right = s + strlen(s) - 1;
    while (left < right) {
        char t = *left;
        *left = *right;
        *right = t;
        left++;
        right--;
    }
}

int main(void) {
    char word[101];
    scanf("%100s", word);
    reverse(word);
    printf("%s\n", word);
    return 0;
}
'''
