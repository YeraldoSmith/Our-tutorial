[[exercise]]
id = "split-time"
kind = "code"
solution = '''
#include <stdio.h>

void split_time(int total, int *h, int *m, int *s) {
    *h = total / 3600;
    *m = total % 3600 / 60;
    *s = total % 60;
}

int main(void) {
    int total = 0, h = 0, m = 0, s = 0;
    scanf("%d", &total);
    split_time(total, &h, &m, &s);
    printf("%d:%02d:%02d\n", h, m, s);
    return 0;
}
'''
