[[exercise]]
id = "sum-n"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    int n = 0;
    scanf("%d", &n);
    long long sum = 0;
    for (int i = 1; i <= n; i++) {
        sum += i;
    }
    printf("%lld\n", sum);
    return 0;
}
'''
tests = [
  { input = "100\n", output = "5050\n" },
  { input = "1\n", output = "1\n" },
  { input = "100000\n", output = "5000050000\n" },
]

[[exercise]]
id = "times-table"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    int n = 0;
    scanf("%d", &n);
    for (int i = 1; i <= 9; i++) {
        printf("%d x %d = %d\n", n, i, n * i);
    }
    return 0;
}
'''
