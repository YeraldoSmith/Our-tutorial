[[exercise]]
id = "matrix-mul"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <stdlib.h>

int main(void) {
    int n = 0, m = 0, p = 0;
    scanf("%d %d %d", &n, &m, &p);
    int *a = malloc(n * m * sizeof *a);
    int *b = malloc(m * p * sizeof *b);
    long long *c = calloc(n * p, sizeof *c);
    if (a == NULL || b == NULL || c == NULL) {
        free(a);
        free(b);
        free(c);
        return 1;
    }
    for (int i = 0; i < n * m; i++) {
        scanf("%d", &a[i]);
    }
    for (int i = 0; i < m * p; i++) {
        scanf("%d", &b[i]);
    }
    for (int i = 0; i < n; i++) {
        for (int j = 0; j < p; j++) {
            for (int k = 0; k < m; k++) {
                c[i * p + j] += (long long)a[i * m + k] * b[k * p + j];
            }
        }
    }
    for (int i = 0; i < n; i++) {
        for (int j = 0; j < p; j++) {
            printf(j == 0 ? "%lld" : " %lld", c[i * p + j]);
        }
        printf("\n");
    }
    free(a);
    free(b);
    free(c);
    return 0;
}
'''
