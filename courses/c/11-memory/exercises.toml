[[exercise]]
id = "reverse-unknown"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <stdlib.h>

int main(void) {
    int capacity = 16, count = 0;
    int *data = malloc(capacity * sizeof *data);
    if (data == NULL) {
        return 1;
    }
    int x;
    while (scanf("%d", &x) == 1) {
        if (count == capacity) {
            capacity *= 2;
            int *bigger = realloc(data, capacity * sizeof *data);
            if (bigger == NULL) {
                free(data);
                return 1;
            }
            data = bigger;
        }
        data[count++] = x;
    }
    for (int i = count - 1; i >= 0; i--) {
        printf(i == count - 1 ? "%d" : " %d", data[i]);
    }
    printf("\n");
    free(data);
    return 0;
}
'''
