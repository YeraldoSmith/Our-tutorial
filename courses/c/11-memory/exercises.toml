[[exercise]]
id = "merge-sorted"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <stdlib.h>

int *read_array(int *n) {
    if (scanf("%d", n) != 1 || *n <= 0) {
        return NULL;
    }
    int *a = malloc(*n * sizeof *a);
    if (a == NULL) {
        return NULL;
    }
    for (int i = 0; i < *n; i++) {
        scanf("%d", &a[i]);
    }
    return a;
}

int main(void) {
    int n = 0, m = 0;
    int *a = read_array(&n);
    int *b = read_array(&m);
    int *c = malloc((n + m) * sizeof *c);
    if (a == NULL || b == NULL || c == NULL) {
        free(a);
        free(b);
        free(c);
        return 1;
    }
    int i = 0, j = 0, k = 0;
    while (i < n && j < m) {
        if (a[i] <= b[j]) {
            c[k++] = a[i++];
        } else {
            c[k++] = b[j++];
        }
    }
    while (i < n) {
        c[k++] = a[i++];
    }
    while (j < m) {
        c[k++] = b[j++];
    }
    for (int t = 0; t < k; t++) {
        printf(t == 0 ? "%d" : " %d", c[t]);
    }
    printf("\n");
    free(a);
    free(b);
    free(c);
    return 0;
}
'''
