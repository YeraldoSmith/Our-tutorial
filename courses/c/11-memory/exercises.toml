[[exercise]]
id = "lines-reverse"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <stdlib.h>
#include <string.h>

int main(void) {
    int capacity = 8, count = 0;
    char **lines = malloc(capacity * sizeof *lines);
    if (lines == NULL) {
        return 1;
    }
    char buf[202];
    while (fgets(buf, sizeof buf, stdin) != NULL) {
        buf[strcspn(buf, "\n")] = '\0';
        if (count == capacity) {
            capacity *= 2;
            char **bigger = realloc(lines, capacity * sizeof *lines);
            if (bigger == NULL) {
                break;
            }
            lines = bigger;
        }
        char *copy = malloc(strlen(buf) + 1);
        if (copy == NULL) {
            break;
        }
        strcpy(copy, buf);
        lines[count++] = copy;
    }
    for (int i = count - 1; i >= 0; i--) {
        printf("%s\n", lines[i]);
        free(lines[i]);
    }
    free(lines);
    return 0;
}
'''
