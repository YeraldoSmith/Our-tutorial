[[exercise]]
id = "point-dist"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <math.h>

typedef struct {
    double x;
    double y;
} Point;

double distance(Point a, Point b) {
    double dx = a.x - b.x, dy = a.y - b.y;
    return sqrt(dx * dx + dy * dy);
}

int main(void) {
    Point a, b;
    scanf("%lf %lf %lf %lf", &a.x, &a.y, &b.x, &b.y);
    printf("%.2f\n", distance(a, b));
    return 0;
}
'''
tests = [
  { input = "0 0 3 4\n", output = "5.00\n" },
  { input = "1 1 1 1\n", output = "0.00\n" },
  { input = "-1 -2 2 2\n", output = "5.00\n" },
  { input = "0.5 1.5 -2.5 3\n", output = "3.35\n" },
  { input = "10 0 0 10\n", output = "14.14\n" },
]

[[exercise]]
id = "fraction-add"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

typedef struct {
    long long num;
    long long den;
} Fraction;

long long gcd(long long a, long long b) {
    if (a < 0) {
        a = -a;
    }
    while (b != 0) {
        long long t = a % b;
        a = b;
        b = t;
    }
    return a;
}

Fraction add(Fraction a, Fraction b) {
    Fraction r = {a.num * b.den + b.num * a.den, a.den * b.den};
    long long g = gcd(r.num, r.den);
    r.num /= g;
    r.den /= g;
    return r;
}

int main(void) {
    Fraction a, b;
    scanf("%lld %lld %lld %lld", &a.num, &a.den, &b.num, &b.den);
    Fraction r = add(a, b);
    printf("%lld/%lld\n", r.num, r.den);
    return 0;
}
'''
tests = [
  { input = "1 2 1 3\n", output = "5/6\n" },
  { input = "1 2 -1 2\n", output = "0/1\n" },
  { input = "3 4 1 4\n", output = "1/1\n" },
  { input = "-5 6 1 3\n", output = "-1/2\n" },
  { input = "0 7 2 9\n", output = "2/9\n" },
  { input = "7 12 5 18\n", output = "31/36\n" },
]

[[exercise]]
id = "student-rank"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <stdlib.h>
#include <string.h>

typedef struct {
    char name[32];
    int score;
} Student;

int by_score(const void *a, const void *b) {
    const Student *x = a;
    const Student *y = b;
    if (x->score != y->score) {
        return (x->score < y->score) - (x->score > y->score);
    }
    return strcmp(x->name, y->name);
}

int main(void) {
    Student s[100];
    int n = 0;
    scanf("%d", &n);
    for (int i = 0; i < n; i++) {
        scanf("%31s %d", s[i].name, &s[i].score);
    }
    qsort(s, n, sizeof s[0], by_score);
    for (int i = 0; i < n; i++) {
        printf("%s %d\n", s[i].name, s[i].score);
    }
    return 0;
}
'''
tests = [
