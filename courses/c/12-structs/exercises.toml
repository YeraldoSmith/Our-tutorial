[[exercise]]
id = "list-remove"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <stdlib.h>

typedef struct Node {
    int value;
    struct Node *next;
} Node;

int main(void) {
    int n = 0, x = 0;
    scanf("%d", &n);
    Node *head = NULL, *tail = NULL;
    for (int i = 0; i < n; i++) {
        Node *node = malloc(sizeof *node);
        if (node == NULL) {
            return 1;
        }
        scanf("%d", &node->value);
        node->next = NULL;
        if (tail == NULL) {
            head = node;
        } else {
            tail->next = node;
        }
        tail = node;
    }
    scanf("%d", &x);
    Node **pp = &head;
    while (*pp != NULL) {
        if ((*pp)->value == x) {
            Node *dead = *pp;
            *pp = dead->next;
            free(dead);
        } else {
            pp = &(*pp)->next;
        }
    }
    if (head == NULL) {
        printf("empty\n");
    }
    for (Node *p = head; p != NULL; p = p->next) {
        printf(p == head ? "%d" : " %d", p->value);
    }
    if (head != NULL) {
        printf("\n");
    }
    while (head != NULL) {
        Node *next = head->next;
        free(head);
        head = next;
    }
    return 0;
}
'''
tests = [
  { input = "6\n3 1 3 4 3 5\n3\n", output = "1 4 5\n" },
  { input = "3\n7 7 7\n7\n", output = "empty\n" },
  { input = "3\n1 2 3\n9\n", output = "1 2 3\n" },
  { input = "0\n\n4\n", output = "empty\n" },
  { input = "3\n5 1 5\n5\n", output = "1\n" },
  { input = "30\n4 1 3 2 1 2 1 0 4 1 0 4 2 3 0 0 0 4 1 0 3 3 0 3 1 4 2 4 4 1\n2\n", output = "4 1 3 1 1 0 4 1 0 4 3 0 0 0 4 1 0 3 3 0 3 1 4 4 4 1\n" },
]

