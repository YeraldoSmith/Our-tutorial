[[exercise]]
id = "transpose"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    int m[10][10];
    int r = 0, c = 0;
    scanf("%d %d", &r, &c);
    for (int i = 0; i < r; i++) {
        for (int j = 0; j < c; j++) {
            scanf("%d", &m[i][j]);
        }
    }
    for (int j = 0; j < c; j++) {
        for (int i = 0; i < r; i++) {
            printf(i == 0 ? "%d" : " %d", m[i][j]);
        }
        printf("\n");
    }
    return 0;
}
'''
tests = [
  { input = "2 3\n1 2 3\n4 5 6\n", output = "1 4\n2 5\n3 6\n" },
  { input = "1 1\n7\n", output = "7\n" },
  { input = "2 2\n1 2\n3 4\n", output = "1 3\n2 4\n" },
  { input = "4 1\n1\n2\n3\n4\n", output = "1 2 3 4\n" },
  { input = "3 5\n5 3 1 7 8\n3 9 2 9 1\n8 0 7 3 2\n", output = "5 3 8\n3 9 0\n1 2 7\n7 9 3\n8 1 2\n" },
]

