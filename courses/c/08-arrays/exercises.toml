[[exercise]]
id = "reverse-array"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

#define MAX_N 1000

int main(void) {
    int a[MAX_N];
    int n = 0;
    scanf("%d", &n);
    for (int i = 0; i < n; i++) {
        scanf("%d", &a[i]);
    }
    for (int i = n - 1; i >= 0; i--) {
        printf("%d", a[i]);
        if (i > 0) {
            printf(" ");
        }
    }
    printf("\n");
    return 0;
}
'''
tests = [
  { input = "5\n1 2 3 4 5\n", output = "5 4 3 2 1\n" },
  { input = "1\n42\n", output = "42\n" },
  { input = "3\n-3 0 7\n", output = "7 0 -3\n" },
  { input = "12\n-41 -5 -3 -67 -50 81 -88 -78 -64 -36 30 -46\n", output = "-46 30 -36 -64 -78 -88 81 -50 -67 -3 -5 -41\n" },
]

[[exercise]]
id = "array-stats"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

#define MAX_N 1000

int main(void) {
    int a[MAX_N];
    int n = 0;
    scanf("%d", &n);
    for (int i = 0; i < n; i++) {
        scanf("%d", &a[i]);
    }
    int max = a[0], min = a[0];
    long long sum = 0;
    for (int i = 0; i < n; i++) {
        if (a[i] > max) {
            max = a[i];
        }
        if (a[i] < min) {
            min = a[i];
        }
        sum += a[i];
    }
    printf("%d %d %.2f\n", max, min, (double)sum / n);
    return 0;
}
'''
tests = [
  { input = "4\n3 -2 10 5\n", output = "10 -2 4.00\n" },
  { input = "1\n7\n", output = "7 7 7.00\n" },
  { input = "3\n-5 -1 -9\n", output = "-1 -9 -5.00\n" },
  { input = "2\n1 2\n", output = "2 1 1.50\n" },
  { input = "7\n100 200 300 400 500 600 700\n", output = "700 100 400.00\n" },
]

[[exercise]]
id = "above-average"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

#define MAX_N 1000

int main(void) {
    int a[MAX_N];
    int n = 0;
    scanf("%d", &n);
    long long sum = 0;
    for (int i = 0; i < n; i++) {
        scanf("%d", &a[i]);
        sum += a[i];
    }
    int count = 0;
    for (int i = 0; i < n; i++) {
        if ((long long)a[i] * n > sum) {
            count++;
        }
    }
    printf("%d\n", count);
    return 0;
}
'''
tests = [
  { input = "5\n1 2 3 4 10\n", output = "1\n" },
  { input = "3\n5 5 5\n", output = "0\n" },
  { input = "4\n1 2 3 4\n", output = "2\n" },
  { input = "4\n-3 -1 -2 10\n", output = "1\n" },
  { input = "1\n0\n", output = "0\n" },
]

[[exercise]]
id = "sort-numbers"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

#define MAX_N 1000

void bubble_sort(int a[], int n) {
    for (int pass = 0; pass < n - 1; pass++) {
        bool swapped = false;
        for (int i = 0; i < n - 1 - pass; i++) {
            if (a[i] > a[i + 1]) {
                int t = a[i];
                a[i] = a[i + 1];
                a[i + 1] = t;
                swapped = true;
            }
        }
        if (!swapped) {
            break;
        }
    }
}

int main(void) {
    int a[MAX_N];
    int n = 0;
    scanf("%d", &n);
    for (int i = 0; i < n; i++) {
        scanf("%d", &a[i]);
    }
    bubble_sort(a, n);
    for (int i = 0; i < n; i++) {
        printf(i == 0 ? "%d" : " %d", a[i]);
    }
    printf("\n");
    return 0;
}
'''
tests = [
  { input = "6\n5 3 9 1 3 7\n", output = "1 3 3 5 7 9\n" },
  { input = "1\n1\n", output = "1\n" },
  { input = "3\n3 2 1\n", output = "1 2 3\n" },
  { input = "4\n1 2 3 4\n", output = "1 2 3 4\n" },
  { input = "40\n-90 157 -469 -30 -1 -36 -101 6 86 -304 418 350 -88 -409 -4 -261 277 -480 217 -227 32 -83 -15 423 433 -112 243 -384 178 -236 -401 333 -436 -105 135 349 -114 -390 176 -441\n", output = "-480 -469 -441 -436 -409 -401 -390 -384 -304 -261 -236 -227 -114 -112 -105 -101 -90 -88 -83 -36 -30 -15 -4 -1 6 32 86 135 157 176 178 217 243 277 333 349 350 418 423 433\n" },
