[[exercise]]
id = "gcd"
kind = "code"
solution = '''
#include <stdio.h>

long long gcd(long long a, long long b) {
    while (b != 0) {
        long long t = a % b;
        a = b;
        b = t;
    }
    return a;
}

int main(void) {
    long long a = 0, b = 0;
    scanf("%lld %lld", &a, &b);
    long long g = gcd(a, b);
    printf("%lld %lld\n", g, a / g * b);
    return 0;
}
'''
