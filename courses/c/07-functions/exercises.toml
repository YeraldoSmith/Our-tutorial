[[exercise]]
id = "count-primes"
kind = "code"
solution = '''
#include <stdio.h>

bool is_prime(int n) {
    if (n < 2) {
        return false;
    }
    for (int d = 2; d * d <= n; d++) {
        if (n % d == 0) {
            return false;
        }
    }
    return true;
}

int main(void) {
    int a = 0, b = 0;
    scanf("%d %d", &a, &b);
    int count = 0;
    for (int k = a; k <= b; k++) {
        if (is_prime(k)) {
            count++;
        }
    }
    printf("%d\n", count);
    return 0;
}
'''
