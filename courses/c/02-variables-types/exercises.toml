[[exercise]]
id = "profile"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {
    int age = 12;
    double height = 1.523;
    char grade = 'B';

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    int age = 12;
    double height = 1.523;
    char grade = 'B';
    printf("Age: %d, Height: %.2f m, Grade: %c\n", age, height, grade);
    return 0;
}
'''
tests = [
  { input = "", output = "Age: 12, Height: 1.52 m, Grade: B\n" },
]

[[exercise]]
id = "sizes"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    printf("%zu %zu %zu %zu\n", sizeof(char), sizeof(int), sizeof(double), sizeof(long long));
    return 0;
}
'''
tests = [
  { input = "", output = "1 4 8 8\n" },
]

