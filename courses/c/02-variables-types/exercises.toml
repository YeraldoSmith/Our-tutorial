[[exercise]]
id = "table"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    printf("%-6s%4d%8.2f\n", "apple", 3, 4.5);
    printf("%-6s%4d%8.2f\n", "kiwi", 12, 0.75);
    return 0;
}
'''
tests = [
  { input = "", output = "apple    3    4.50\nkiwi    12    0.75\n" },
]

