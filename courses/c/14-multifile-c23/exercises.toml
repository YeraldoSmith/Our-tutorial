[[exercise]]
id = "find-negative"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

int *find_negative(int a[], int n) {
    for (int i = 0; i < n; i++) {
        if (a[i] < 0) {
            return &a[i];
        }
    }
    return nullptr;
}

int main(void) {
    int a[1000];
    int n = 0;
    scanf("%d", &n);
    for (int i = 0; i < n; i++) {
        scanf("%d", &a[i]);
    }
    int *p = find_negative(a, n);
    if (p != nullptr) {
        printf("%td %d\n", p - a, *p);
    } else {
        printf("none\n");
    }
    return 0;
}
'''
tests = [
  { input = "5\n4 0 -7 2 -1\n", output = "2 -7\n" },
  { input = "3\n1 2 3\n", output = "none\n" },
  { input = "1\n-5\n", output = "0 -5\n" },
