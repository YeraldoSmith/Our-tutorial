[[exercise]]
id = "to-binary"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    int x = 0;
    scanf("%d", &x);
    int ones = 0;
    bool started = false;
    for (int bit = 30; bit >= 0; bit--) {
        int b = (x >> bit) & 1;
        if (b == 1) {
            started = true;
            ones++;
        }
        if (started) {
            printf("%d", b);
        }
    }
    if (!started) {
        printf("0");
    }
    printf(" %d\n", ones);
    return 0;
}
'''
tests = [
  { input = "10\n", output = "1010 2\n" },
  { input = "0\n", output = "0 0\n" },
  { input = "1\n", output = "1 1\n" },
  { input = "255\n", output = "11111111 8\n" },
  { input = "1024\n", output = "10000000000 1\n" },
  { input = "2147483647\n", output = "1111111111111111111111111111111 31\n" },
  { input = "123456789\n", output = "111010110111100110100010101 16\n" },
]

