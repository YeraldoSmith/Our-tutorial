[[exercise]]
id = "stack-module"
kind = "code"
solution = '''
#include <stdio.h>
#include <string.h>

// ======== stack.h：模块的「接口」 ========
void stack_push(int value);
int stack_pop(void);            // 栈为空时返回 -1
bool stack_empty(void);
int stack_size(void);

// ======== stack.c：模块的「实现」（请补全） ========
#define STACK_MAX 100
static int items[STACK_MAX];    // static：只有本文件能直接访问
static int top = 0;             // 栈里现在有几个元素

void stack_push(int value) {
    if (top < STACK_MAX) {
        items[top] = value;
        top++;
    }
}

int stack_pop(void) {
    if (top == 0) {
        return -1;
    }
    top--;
    return items[top];
}

bool stack_empty(void) {
    return top == 0;
}

int stack_size(void) {
    return top;
}

// ======== main.c：使用这个模块 ========
int main(void) {
    char cmd[16];
    int x = 0;
    while (scanf("%15s", cmd) == 1) {
        if (strcmp(cmd, "push") == 0 && scanf("%d", &x) == 1) {
            stack_push(x);
        } else if (strcmp(cmd, "pop") == 0) {
            printf("%d\n", stack_pop());
        } else if (strcmp(cmd, "size") == 0) {
            printf("%d\n", stack_size());
        }
    }
    return 0;
}
'''
