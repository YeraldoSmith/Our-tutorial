[[exercise]]
id = "divide"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {
    int a = 17, b = 5;

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    int a = 17, b = 5;
    printf("%d %d %.2f\n", a / b, a % b, (double)a / b);
    return 0;
}
'''
tests = [
  { input = "", output = "3 2 3.40\n" },
]

[[exercise]]
id = "clock"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {
    int total = 3725;

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    int total = 3725;
    printf("%d:%02d:%02d\n", total / 3600, total % 3600 / 60, total % 60);
    return 0;
}
'''
tests = [
  { input = "", output = "1:02:05\n" },
]

[[exercise]]
id = "circle"
kind = "code"
starter = '''
#include <stdio.h>
#include <math.h>

int main(void) {
    double r = 2.5;

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <math.h>

int main(void) {
    double r = 2.5;
    double pi = acos(-1.0);
    printf("%.2f %.2f\n", pi * r * r, 2 * pi * r);
    return 0;
}
'''
tests = [
  { input = "", output = "19.63 15.71\n" },
]

