  { input = "25\nabc XYZ\n", output = "zab WXY\n" },
  { input = "13\nWhy did the chicken cross the road?\n", output = "Jul qvq gur puvpxra pebff gur ebnq?\n" },
  { input = "1\nzZ 9\n", output = "aA 9\n" },
