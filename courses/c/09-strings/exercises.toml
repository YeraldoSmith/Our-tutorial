[[exercise]]
id = "word-count"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <string.h>

int main(void) {
    char line[1001];
    if (fgets(line, sizeof line, stdin) == NULL) {
        line[0] = '\0';
    }
    line[strcspn(line, "\n")] = '\0';
    int words = 0;
    for (int i = 0; line[i] != '\0'; i++) {
        if (line[i] != ' ' && (i == 0 || line[i - 1] == ' ')) {
            words++;
        }
    }
    printf("%d\n", words);
    return 0;
}
'''
tests = [
  { input = "  the quick  brown fox \n", output = "4\n" },
  { input = "hello\n", output = "1\n" },
  { input = "\n", output = "0\n" },
  { input = "   \n", output = "0\n" },
  { input = "one two three four five six\n", output = "6\n" },
]

[[exercise]]
id = "title-case"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <string.h>
#include <ctype.h>

int main(void) {
    char line[1001];
    if (fgets(line, sizeof line, stdin) == NULL) {
        line[0] = '\0';
    }
    line[strcspn(line, "\n")] = '\0';
    for (int i = 0; line[i] != '\0'; i++) {
        unsigned char c = (unsigned char)line[i];
        if (i == 0 || line[i - 1] == ' ') {
            line[i] = (char)toupper(c);
        } else {
            line[i] = (char)tolower(c);
        }
    }
    printf("%s\n", line);
    return 0;
}
'''
tests = [
  { input = "hello wORLD from c\n", output = "Hello World From C\n" },
  { input = "a\n", output = "A\n" },
  { input = "the C PROGRAMMING language\n", output = "The C Programming Language\n" },
  { input = "  two  spaces\n", output = "  Two  Spaces\n" },
  { input = "x1 y2\n", output = "X1 Y2\n" },
]

