[[exercise]]
id = "char-classes"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <string.h>
#include <ctype.h>

int main(void) {
    char line[1001];
    if (fgets(line, sizeof line, stdin) == NULL) {
        line[0] = '\0';
    }
    line[strcspn(line, "\n")] = '\0';
    int letters = 0, digits = 0, spaces = 0, others = 0;
    for (int i = 0; line[i] != '\0'; i++) {
        unsigned char c = (unsigned char)line[i];
        if (isalpha(c)) {
            letters++;
        } else if (isdigit(c)) {
            digits++;
        } else if (c == ' ') {
            spaces++;
        } else {
            others++;
        }
    }
    printf("%d %d %d %d\n", letters, digits, spaces, others);
    return 0;
}
'''
tests = [
  { input = "Hello World 123!\n", output = "10 3 2 1\n" },
  { input = "abc\n", output = "3 0 0 0\n" },
  { input = "  \n", output = "0 0 2 0\n" },
  { input = "C23 is out (2024), finally.\n", output = "13 6 4 4\n" },
  { input = "x=1+2;\n", output = "1 2 0 3\n" },
]

[[exercise]]
id = "palindrome"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <string.h>
#include <ctype.h>

int main(void) {
    char s[101];
    scanf("%100s", s);
    bool ok = true;
    int i = 0, j = (int)strlen(s) - 1;
    while (i < j) {
        if (tolower((unsigned char)s[i]) != tolower((unsigned char)s[j])) {
            ok = false;
            break;
        }
        i++;
        j--;
    }
    printf("%s\n", ok ? "yes" : "no");
    return 0;
}
'''
tests = [
  { input = "Level\n", output = "yes\n" },
  { input = "level\n", output = "yes\n" },
  { input = "abc\n", output = "no\n" },
  { input = "a\n", output = "yes\n" },
  { input = "abba\n", output = "yes\n" },
  { input = "ab\n", output = "no\n" },
  { input = "RaceCar\n", output = "yes\n" },
  { input = "Hannah\n", output = "yes\n" },
  { input = "abca\n", output = "no\n" },
]

[[exercise]]
id = "caesar"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <string.h>

int main(void) {
    int k = 0;
    char line[1001];
    scanf("%d", &k);
    int ch;
    while ((ch = getchar()) != '\n' && ch != EOF) {
    }
    if (fgets(line, sizeof line, stdin) == NULL) {
        line[0] = '\0';
    }
    line[strcspn(line, "\n")] = '\0';
    for (int i = 0; line[i] != '\0'; i++) {
        char c = line[i];
        if (c >= 'a' && c <= 'z') {
            line[i] = (char)('a' + (c - 'a' + k) % 26);
        } else if (c >= 'A' && c <= 'Z') {
            line[i] = (char)('A' + (c - 'A' + k) % 26);
        }
    }
    printf("%s\n", line);
    return 0;
}
'''
tests = [
