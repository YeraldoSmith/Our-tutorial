[[exercise]]
id = "sum-two"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    int a = 0, b = 0;
    scanf("%d %d", &a, &b);
    printf("%d %d %d\n", a + b, a - b, a * b);
    return 0;
}
'''
tests = [
  { input = "7 3\n", output = "10 4 21\n" },
  { input = "-2 5\n", output = "3 -7 -10\n" },
  { input = "0 0\n", output = "0 0 0\n" },
]

[[exercise]]
id = "avg3"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    double a = 0, b = 0, c = 0;
    scanf("%lf %lf %lf", &a, &b, &c);
    printf("%.2f\n", (a + b + c) / 3);
    return 0;
}
'''
tests = [
  { input = "1.5 2.5 4\n", output = "2.67\n" },
  { input = "1 2 3\n", output = "2.00\n" },
  { input = "-1 0 0.5\n", output = "-0.17\n" },
]

[[exercise]]
id = "next-year"
kind = "code"
starter = '''
#include <stdio.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>

int main(void) {
    char name[50];
    int age = 0;
    scanf("%49s %d", name, &age);
    printf("%s will be %d next year.\n", name, age + 1);
    return 0;
}
'''
tests = [
  { input = "Tom 12\n", output = "Tom will be 13 next year.\n" },
  { input = "Ann 0\n", output = "Ann will be 1 next year.\n" },
  { input = "Li\n99\n", output = "Li will be 100 next year.\n" },
]

[[exercise]]
id = "until-eof"
kind = "code"
starter = '''
#include <stdio.h>
#include <limits.h>

int main(void) {

    return 0;
}
'''
solution = '''
#include <stdio.h>
#include <limits.h>

int main(void) {
    int x = 0, count = 0, max = INT_MIN;
    long long sum = 0;
    while (scanf("%d", &x) == 1) {
        sum += x;
        count++;
        if (x > max) max = x;
    }
    printf("%d %lld %d\n", count, sum, max);
    return 0;
}
'''
tests = [
  { input = "3 8 1 9 4\n", output = "5 25 9\n" },
  { input = "-5\n", output = "1 -5 -5\n" },
  { input = "1\n2\n3\n", output = "3 6 3\n" },
  { input = "-3 -1 -2\n", output = "3 -6 -1\n" },
]

