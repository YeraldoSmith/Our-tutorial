[[exercise]]
id = "grade"
kind = "code"
solution = '''
def grade(score):
    if score >= 90:
        return "A"
    elif score >= 80:
        return "B"
    elif score >= 70:
        return "C"
    elif score >= 60:
        return "D"
    else:
        return "F"


scores = list(map(int, input().split()))
print(" ".join(grade(s) for s in scores))
'''
