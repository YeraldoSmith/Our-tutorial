[[exercise]]
id = "max3"
kind = "code"
solution = '''
def max3(a, b, c):
    biggest = a
    if b > biggest:
        biggest = b
    if c > biggest:
        biggest = c
    return biggest


a, b, c = map(int, input().split())
print(max3(a, b, c))
'''
tests = [
  { input = "3 9 4\n", output = "9\n" },
  { input = "-1 -5 -3\n", output = "-1\n" },
  { input = "7 7 2\n", output = "7\n" },
  { input = "1 2 3\n", output = "3\n" },
]

