[[exercise]]
id = "is-prime"
kind = "code"
solution = '''
def is_prime(n):
    if n < 2:
        return False
    for d in range(2, int(n ** 0.5) + 1):
        if n % d == 0:
            return False
    return True


n = int(input())
print("yes" if is_prime(n) else "no")
'''
tests = [
  { input = "97\n", output = "yes\n" },
  { input = "1\n", output = "no\n" },
  { input = "2\n", output = "yes\n" },
  { input = "9\n", output = "no\n" },
  { input = "0\n", output = "no\n" },
  { input = "7919\n", output = "yes\n" },
  { input = "1000000\n", output = "no\n" },
]

