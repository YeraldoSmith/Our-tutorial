[[exercise]]
id = "safe-int"
kind = "code"
starter = '''
n = int(input())
for _ in range(n):
    text = input()
'''
solution = '''
n = int(input())
for _ in range(n):
    text = input()
    try:
        print(int(text) * 2)
    except ValueError:
        print("invalid")
'''
tests = [
  { input = "3\n21\nabc\n-4\n", output = "42\ninvalid\n-8\n" },
  { input = "2\n3.5\n0\n", output = "invalid\n0\n" },
  { input = "1\n十二\n", output = "invalid\n" },
]

[[exercise]]
id = "safe-divide"
kind = "code"
starter = '''
n = int(input())
for _ in range(n):
    a_text, b_text = input().split()
'''
solution = '''
n = int(input())
for _ in range(n):
    a_text, b_text = input().split()
    try:
        print(f"{float(a_text) / float(b_text):.2f}")
    except ZeroDivisionError:
        print("division by zero")
    except ValueError:
        print("invalid")
'''
tests = [
  { input = "3\n10 4\n1 0\nx 2\n", output = "2.50\ndivision by zero\ninvalid\n" },
  { input = "2\n-9 3\n5 y\n", output = "-3.00\ninvalid\n" },
  { input = "1\n0 0\n", output = "division by zero\n" },
]

[[exercise]]
id = "raise-age"
kind = "code"
solution = '''
def check_age(age):
    if age < 0 or age > 150:
        raise ValueError("age must be between 0 and 150")
    return age


for age in map(int, input().split()):
    try:
        check_age(age)
        print("ok")
    except ValueError as e:
        print(e)
'''
tests = [
  { input = "12 -1 151 150\n", output = "ok\nage must be between 0 and 150\nage must be between 0 and 150\nok\n" },
  { input = "0\n", output = "ok\n" },
  { input = "-100 200\n", output = "age must be between 0 and 150\nage must be between 0 and 150\n" },
]
