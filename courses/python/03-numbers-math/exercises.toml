[[exercise]]
id = "time-convert"
kind = "code"
starter = '''
total = 7384
'''
solution = '''
total = 7384
hours = total // 3600
minutes = total % 3600 // 60
seconds = total % 60
print(hours, minutes, seconds)
'''
tests = [{ input = "", output = "2 3 4\n" }]

[[exercise]]
id = "circle"
kind = "code"
starter = '''
import math

r = 3
'''
solution = '''
import math

r = 3
area = math.pi * r ** 2
print(f"{area:.2f}")
'''
tests = [{ input = "", output = "28.27\n" }]

