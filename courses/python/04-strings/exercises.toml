[[exercise]]
id = "date-format"
kind = "code"
starter = '''
date = "2026-11-12"
'''
solution = '''
date = "2026-11-12"
parts = date.split("-")
print(parts[2] + "/" + parts[1] + "/" + parts[0])
'''
tests = [{ input = "", output = "12/11/2026\n" }]

