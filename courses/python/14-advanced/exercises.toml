[[exercise]]
id = "match-commands"
kind = "code"
solution = '''
while True:
    match input().split():
        case ["quit"]:
            break
        case ["add", a, b]:
            print(int(a) + int(b))
        case ["mul", a, b]:
            print(int(a) * int(b))
        case ["neg", a]:
            print(-int(a))
        case _:
            print("unknown")
'''
tests = [
  { input = "add 2 3\nneg 7\npow 2 3\nmul 4 5\nquit\n", output = "5\n-7\nunknown\n20\n" },
  { input = "quit\n", output = "" },
  { input = "add 1\nneg -4\nmul -2 8\nquit\n", output = "unknown\n4\n-16\n" },
]
