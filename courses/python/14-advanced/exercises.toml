[[exercise]]
id = "big-fib"
kind = "code"
solution = '''
from functools import cache


@cache
def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)


n = int(input())
print(fib(n))
'''
tests = [
  { input = "90\n", output = "2880067194370816120\n" },
  { input = "0\n", output = "0\n" },
  { input = "1\n", output = "1\n" },
  { input = "10\n", output = "55\n" },
  { input = "300\n", output = "222232244629420445529739893461909967206666939096499764990979600\n" },
]
