[[exercise]]
id = "star-average"
kind = "code"
solution = '''
def stats(*nums):
    return min(nums), max(nums), sum(nums) / len(nums)


nums = list(map(int, input().split()))
lo, hi, avg = stats(*nums)
print(lo, hi, f"{avg:.2f}")
'''
tests = [
  { input = "4 8 15 16 23 42\n", output = "4 42 18.00\n" },
