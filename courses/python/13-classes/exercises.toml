[[exercise]]
id = "shapes"
kind = "code"
solution = '''
import math


class Shape:
    def area(self):
        return 0.0


class Circle(Shape):
    def __init__(self, r):
        self.r = r

    def area(self):
        return math.pi * self.r ** 2


class Square(Shape):
    def __init__(self, a):
        self.a = a

    def area(self):
        return self.a ** 2


shapes = []
while True:
    parts = input().split()
    if parts[0] == "end":
        break
    size = float(parts[1])
    shapes.append(Circle(size) if parts[0] == "circle" else Square(size))
for shape in shapes:
    print(f"{shape.area():.2f}")
'''
tests = [
  { input = "circle 1\nsquare 2\nend\n", output = "3.14\n4.00\n" },
  { input = "square 1.5\ncircle 2\ncircle 0.5\nend\n", output = "2.25\n12.57\n0.79\n" },
  { input = "end\n", output = "" },
]
