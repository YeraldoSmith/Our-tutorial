[[exercise]]
id = "dataclass-sort"
kind = "code"
solution = '''
from dataclasses import dataclass


@dataclass
class Student:
    name: str
    score: int


n = int(input())
students = []
for _ in range(n):
    name, score = input().split()
    students.append(Student(name, int(score)))
students.sort(key=lambda s: (-s.score, s.name))
for s in students:
    print(s.name)
'''
tests = [
  { input = "3\nTom 80\nAmy 95\nBob 80\n", output = "Amy\nBob\nTom\n" },
  { input = "1\nZed 0\n", output = "Zed\n" },
  { input = "4\nb 1\na 1\nd 2\nc 2\n", output = "c\nd\na\nb\n" },
]
