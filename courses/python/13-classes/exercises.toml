[[exercise]]
id = "bank"
kind = "code"
solution = '''
class BankAccount:
    def __init__(self):
        self.balance = 0

    def deposit(self, amount):
        self.balance += amount

    def withdraw(self, amount):
        if amount > self.balance:
            return False
        self.balance -= amount
        return True


acc = BankAccount()
while True:
    parts = input().split()
    if parts[0] == "end":
        break
    if parts[0] == "deposit":
        acc.deposit(int(parts[1]))
    elif parts[0] == "withdraw":
        if not acc.withdraw(int(parts[1])):
            print("insufficient funds")
    elif parts[0] == "balance":
        print(acc.balance)
'''
