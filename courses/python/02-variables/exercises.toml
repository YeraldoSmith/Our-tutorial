[[exercise]]
id = "swap"
kind = "code"
starter = '''
a = 1
b = 2

print(a, b)
'''
solution = '''
a = 1
b = 2
a, b = b, a
print(a, b)
'''
tests = [{ input = "", output = "2 1\n" }]

